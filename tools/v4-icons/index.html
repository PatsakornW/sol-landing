<!doctype html>
<meta charset="utf-8" />
<title>V4 icon renderer</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@800&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; background: transparent; }
  canvas { display: block; }
  .probe { position: absolute; opacity: 0; font-family: 'Manrope'; font-weight: 800; }
</style>
<span class="probe">SOL YES NO $ B ?</span>
<script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
</script>
<script type="module">
  /*
   * V4's 3D pieces, in the reference's manner: matte black and chrome, grey
   * spheres, a glossy neon spark — in the mark's pink and blue — exported as
   * transparent WebP. `?icon=<name>&w=<px>&h=<px>`.
   */
  import * as THREE from 'three';
  import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
  import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
  import { FontLoader } from 'three/addons/loaders/FontLoader.js';
  import { TextGeometry } from 'three/addons/geometries/TextGeometry.js';

  const q = new URLSearchParams(location.search);
  const NAME = q.get('icon') || 'coin';
  const W = +(q.get('w') || 1024);
  const H = +(q.get('h') || W);

  const PINK = '#DC74EC';
  const BLUE = '#1E69F6';

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(1);
  renderer.setSize(W, H);
  renderer.setClearColor(0x000000, 0);
  renderer.toneMapping = THREE.NeutralToneMapping;
  renderer.toneMappingExposure = 1.0;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  document.body.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

  const camera = new THREE.PerspectiveCamera(24, W / H, 0.1, 200);
  camera.position.set(0, 0, 10);

  const key = new THREE.DirectionalLight(0xffffff, 2.4);
  key.position.set(-4, 6, 6);
  scene.add(key);
  const fill = new THREE.DirectionalLight(0xe6e2ff, 0.6);
  fill.position.set(5, -3, 4);
  scene.add(fill);
  const rim = new THREE.DirectionalLight(0xffffff, 1.6);
  rim.position.set(3, 4, -6);
  scene.add(rim);
  scene.add(new THREE.AmbientLight(0xffffff, 0.15));

  /* The reference's materials: soft matte black, bright chrome, satin silver, grey clay, gloss. */
  const black = () => new THREE.MeshPhysicalMaterial({ color: '#141418', roughness: 0.5, metalness: 0.25, clearcoat: 0.6, clearcoatRoughness: 0.35 });
  const chrome = () => new THREE.MeshPhysicalMaterial({ color: '#dfe1e8', roughness: 0.16, metalness: 1, envMapIntensity: 1.25 });
  const satin = () => new THREE.MeshPhysicalMaterial({ color: '#b8bcc6', roughness: 0.34, metalness: 1 });
  const clay = () => new THREE.MeshPhysicalMaterial({ color: '#6c6c72', roughness: 0.55, metalness: 0.05, clearcoat: 0.3, clearcoatRoughness: 0.5 });
  const gloss = (color, extra = {}) =>
    new THREE.MeshPhysicalMaterial({ color, roughness: 0.32, metalness: 0.05, clearcoat: 0.55, clearcoatRoughness: 0.12, envMapIntensity: 0.5, ...extra });

  function labelTexture(text, color, size = 300) {
    const c = document.createElement('canvas');
    c.width = c.height = 512;
    const g = c.getContext('2d');
    g.fillStyle = color;
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.font = `800 ${size}px "Manrope", sans-serif`;
    g.fillText(text, 256, 270);
    const t = new THREE.CanvasTexture(c);
    t.colorSpace = THREE.SRGBColorSpace;
    t.anisotropy = 8;
    return t;
  }

  /* A disc on the XY plane facing +Z: body, a raised rim, and a face. */
  function coinBody(r, depth, bodyMat, rimMat = bodyMat) {
    const g = new THREE.Group();
    const body = new THREE.Mesh(new THREE.CylinderGeometry(r, r, depth, 128), bodyMat);
    body.rotation.x = Math.PI / 2;
    g.add(body);
    for (const side of [1, -1]) {
      const ring = new THREE.Mesh(new THREE.TorusGeometry(r * 0.9, depth * 0.24, 24, 128), rimMat);
      ring.position.z = (side * depth) / 2;
      g.add(ring);
    }
    return g;
  }

  /* The mark in relief: the left circle in horizontal stripes, the right solid and on top. */
  function markRelief(r, mat, depth = 0.12) {
    const g = new THREE.Group();
    const d = (16 / 17) * r;
    const left = -d / 2;
    const right = d / 2;
    const period = (6.5 / 17) * r;
    const bar = (4 / 17) * r;
    for (let y0 = -r; y0 < r; y0 += period) {
      const y1 = Math.min(y0 + bar, r);
      if (y1 <= y0) continue;
      const shape = new THREE.Shape();
      const pts = [];
      const steps = 24;
      for (let i = 0; i <= steps; i++) {
        const y = y0 + ((y1 - y0) * i) / steps;
        pts.push([Math.sqrt(Math.max(r * r - y * y, 0)), y]);
      }
      shape.moveTo(left - pts[0][0], pts[0][1]);
      pts.forEach(([x, y]) => shape.lineTo(left + x, y));
      [...pts].reverse().forEach(([x, y]) => shape.lineTo(left - x, y));
      g.add(new THREE.Mesh(new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: true, bevelSize: 0.012, bevelThickness: 0.012, bevelSegments: 3 }), mat));
    }
    const disc = new THREE.Shape();
    disc.absarc(right, 0, r, 0, Math.PI * 2);
    const solid = new THREE.Mesh(new THREE.ExtrudeGeometry(disc, { depth: depth * 1.5, bevelEnabled: true, bevelSize: 0.02, bevelThickness: 0.02, bevelSegments: 4, curveSegments: 96 }), mat);
    g.add(solid);
    return g;
  }

  const ICONS = {
    /* The hero coin: matte black, a chrome rim, the mark in chrome relief. */
    coin() {
      const g = coinBody(1.7, 0.36, black(), black());
      const inner = new THREE.Mesh(new THREE.TorusGeometry(1.42, 0.035, 16, 160), chrome());
      inner.position.z = 0.2;
      g.add(inner);
      const mark = markRelief(0.86, chrome());
      mark.position.z = 0.18;
      g.add(mark);
      g.rotation.set(-0.12, 0.42, 0.06);
      camera.position.z = 10.5;
      return g;
    },
    sphere() {
      camera.position.z = 9.5;
      return new THREE.Mesh(new THREE.SphereGeometry(1, 96, 96), clay());
    },
    /* The neon spark: glossy pink spikes out of a centre, a little turned. */
    star() {
      const g = new THREE.Group();
      const mat = gloss(PINK, { emissive: PINK, emissiveIntensity: 0.8 });
      const n = 14;
      for (let i = 0; i < n; i++) {
        const a = (i / n) * Math.PI * 2 + (i % 2) * 0.12;
        const len = i % 2 ? 1.05 : 1.6;
        const spike = new THREE.Mesh(new THREE.ConeGeometry(0.075, len, 18), mat);
        spike.position.set(Math.cos(a) * (len / 2), Math.sin(a) * (len / 2), (i % 3) * 0.04);
        spike.rotation.z = a - Math.PI / 2;
        g.add(spike);
      }
      g.add(new THREE.Mesh(new THREE.SphereGeometry(0.12, 32, 32), mat));
      g.rotation.set(0.35, -0.45, 0);
      camera.position.z = 13;
      return g;
    },
    /* The glass rod the reference clips its cards with. */
    capsule() {
      const m = new THREE.MeshPhysicalMaterial({ color: '#d7dae3', roughness: 0.08, metalness: 0.2, clearcoat: 1, transparent: true, opacity: 0.78 });
      const c = new THREE.Mesh(new THREE.CapsuleGeometry(0.16, 1.8, 16, 48), m);
      c.rotation.set(0.3, 0.2, -0.7);
      camera.position.z = 11;
      return c;
    },
    /* Big monochrome pieces for the platform grid's sides, as the reference's chess men. */
    gavel() {
      const g = new THREE.Group();
      const head = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 1.9, 64), clay());
      head.rotation.z = Math.PI / 2;
      head.position.y = 0.7;
      g.add(head);
      for (const x of [-0.72, 0.72]) {
        const band = new THREE.Mesh(new THREE.TorusGeometry(0.5, 0.06, 16, 64), black());
        band.rotation.y = Math.PI / 2;
        band.position.set(x, 0.7, 0);
        g.add(band);
      }
      const handle = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.16, 2.6, 32), black());
      handle.position.y = -0.85;
      g.add(handle);
      g.rotation.set(0.2, 0.5, -0.5);
      camera.position.z = 15;
      return g;
    },
    ballot() {
      const g = new THREE.Group();
      g.add(new THREE.Mesh(new RoundedBoxGeometry(2, 1.5, 1.5, 6, 0.12), clay()));
      const slot = new THREE.Mesh(new RoundedBoxGeometry(1.1, 0.06, 0.22, 4, 0.03), black());
      slot.position.y = 0.76;
      g.add(slot);
      const paper = new THREE.Mesh(new RoundedBoxGeometry(0.9, 1.0, 0.04, 4, 0.02), satin());
      paper.position.set(0, 1.15, 0);
      paper.rotation.z = 0.08;
      g.add(paper);
      g.rotation.set(0.35, -0.6, 0);
      camera.position.z = 14;
      return g;
    },
  };

  /* The coin row: one coin per symbol, turned to show its edge, in the reference's four finishes. */
  const COINS = {
    'c-sol': { body: black, rim: chrome, label: 'SOL', color: '#d8dbe3', size: 170, metalLabel: true },
    'c-yes': { body: () => gloss(PINK), rim: () => gloss(PINK), label: 'YES', color: '#ffffff', size: 170 },
    'c-no': { body: black, rim: satin, label: 'NO', color: '#c9ccd5', size: 190, metalLabel: true },
    'c-usdc': { body: () => gloss(BLUE), rim: () => gloss(BLUE), label: '$', color: '#ffffff', size: 300 },
    'c-btc': { body: satin, rim: chrome, label: 'B', color: '#2a2b31', size: 300, reeded: true },
    'c-q': { body: black, rim: () => gloss(PINK), label: '?', color: PINK, size: 300 },
  };
  for (const [name, c] of Object.entries(COINS)) {
    ICONS[name] = () => {
      const g = coinBody(1.3, 0.26, c.body(), c.rim());
      if (c.reeded) {
        for (let i = 0; i < 120; i++) {
          const a = (i / 120) * Math.PI * 2;
          const ridge = new THREE.Mesh(new THREE.BoxGeometry(0.035, 0.05, 0.26), c.rim());
          ridge.position.set(Math.cos(a) * 1.31, Math.sin(a) * 1.31, 0);
          ridge.rotation.z = a;
          g.add(ridge);
        }
      }
      const face = new THREE.Mesh(
        new THREE.CircleGeometry(1.1, 96),
        new THREE.MeshPhysicalMaterial({ map: labelTexture(c.label, c.color, c.size), transparent: true, roughness: 0.45, metalness: c.metalLabel ? 0.7 : 0.05 }),
      );
      face.position.z = 0.135;
      g.add(face);
      g.rotation.set(0.08, -0.62, 0.04);
      camera.position.z = 9.5;
      return g;
    };
  }

  /* Words in 3D: extruded, beveled, a pink-to-blue gradient across. */
  async function words(text, size) {
    const font = await new FontLoader().loadAsync('https://cdn.jsdelivr.net/npm/three@0.170.0/examples/fonts/helvetiker_bold.typeface.json');
    const geo = new TextGeometry(text, { font, size, depth: size * 0.34, curveSegments: 16, bevelEnabled: true, bevelThickness: size * 0.05, bevelSize: size * 0.035, bevelSegments: 6 });
    geo.computeBoundingBox();
    geo.center();
    const bb = geo.boundingBox;
    // A deeper pink than the mark's, so the gradient keeps its colour under the lights.
    const a = new THREE.Color('#C43BE0');
    const b = new THREE.Color(BLUE);
    const pos = geo.attributes.position;
    const cols = new Float32Array(pos.count * 3);
    for (let i = 0; i < pos.count; i++) {
      const t = (pos.getX(i) - bb.min.x) / (bb.max.x - bb.min.x);
      const c = a.clone().lerp(b, t);
      // The sides a shade deeper than the faces, as the reference's extrusion.
      if (Math.abs(pos.getZ(i)) < size * 0.15) c.multiplyScalar(0.62);
      cols.set([c.r, c.g, c.b], i * 3);
    }
    geo.setAttribute('color', new THREE.BufferAttribute(cols, 3));
    const mesh = new THREE.Mesh(geo, new THREE.MeshPhysicalMaterial({ vertexColors: true, roughness: 0.34, metalness: 0.05, clearcoat: 0.6, clearcoatRoughness: 0.12, envMapIntensity: 0.45 }));
    mesh.rotation.set(-0.12, 0.08, 0);
    const span = bb.max.x - bb.min.x;
    camera.position.z = (span * 0.6) / Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) / camera.aspect;
    return mesh;
  }
  ICONS.n62 = () => words('62%', 2);
  ICONS.word = () => words('SOLSMARKET', 2);

  try {
    const obj = await ICONS[NAME]();
    scene.add(obj);
    await document.fonts.ready;
    renderer.render(scene, camera);
    window.__out = renderer.domElement.toDataURL('image/webp', 0.9);
    window.__png = renderer.domElement.toDataURL('image/png');
  } catch (e) {
    window.__out = 'error ' + e.message;
  }
</script>
