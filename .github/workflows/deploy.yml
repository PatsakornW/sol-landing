name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# GitHub Pages deploys need an OIDC token and the pages scope.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes one still in flight.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node first, so pnpm itself runs on the version the project expects.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        # Reads the version from `packageManager` in package.json.

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint

      # Turn Pages on for the repository, with Actions as the source, if it is
      # not already. Best effort: the workflow token is not always allowed to
      # (a private repository on a free plan, for one), and then the setting
      # has to be made by hand under Settings → Pages — the build itself does
      # not depend on this step.
      - name: Enable GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
        continue-on-error: true

      # A project site is served at https://<owner>.github.io/<repo>, so the
      # base path is the repository name. Both are derived here rather than
      # read back from the Pages API, which the step above may not have
      # reached. For a custom domain set the repository variable
      # NEXT_PUBLIC_BASE_PATH to a single space — the build trims it to
      # nothing — and NEXT_PUBLIC_SITE_URL to the domain.
      - name: Resolve the site URL
        id: site
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          base="${BASE_PATH_OVERRIDE:-/$repo}"
          base="$(echo "$base" | xargs)"
          echo "base_path=$base" >> "$GITHUB_OUTPUT"
          echo "url=${SITE_URL_OVERRIDE:-https://$owner.github.io$base}" >> "$GITHUB_OUTPUT"
        env:
          BASE_PATH_OVERRIDE: ${{ vars.NEXT_PUBLIC_BASE_PATH }}
          SITE_URL_OVERRIDE: ${{ vars.NEXT_PUBLIC_SITE_URL }}

      - run: pnpm build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.site.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.site.outputs.url }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_DOCS_URL: ${{ vars.NEXT_PUBLIC_DOCS_URL }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
