name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# GitHub Pages deploys need an OIDC token and the pages scope.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes one still in flight.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node first, so pnpm itself runs on the version the project expects.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        # Reads the version from `packageManager` in package.json.

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint

      # A project site is served under /<repo>; a custom domain is not. Either
      # way the base path comes from the Pages configuration, not a hardcode.
      # `enablement` turns Pages on for the repository the first time this
      # runs, with GitHub Actions as the source, so no setting has to be
      # clicked beforehand.
      - id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - run: pnpm build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.origin }}${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_DOCS_URL: ${{ vars.NEXT_PUBLIC_DOCS_URL }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
